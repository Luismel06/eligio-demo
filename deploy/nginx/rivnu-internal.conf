# Internal HTTPS rehearsal with a temporary self-signed certificate. Clients
# need temporary DNS or hosts entries resolving both names to VM1 (10.0.0.2)
# and must explicitly trust the temporary certificate.

server {
    listen 80;
    listen [::]:80;

    server_name rivnu.internal api.rivnu.internal;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name rivnu.internal;

    ssl_certificate /etc/ssl/corestack/rivnu-internal.crt;
    ssl_certificate_key /etc/ssl/corestack/private/rivnu-internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        proxy_pass http://10.0.0.3:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.rivnu.internal;

    ssl_certificate /etc/ssl/corestack/rivnu-internal.crt;
    ssl_certificate_key /etc/ssl/corestack/private/rivnu-internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        proxy_pass http://10.0.0.3:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
