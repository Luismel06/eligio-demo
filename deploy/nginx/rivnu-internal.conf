# Internal HTTP rehearsal only. Do not present this as production or use it for
# mobile camera/OCR, which requires HTTPS. Clients need temporary DNS or hosts
# entries resolving both names to VM1 (10.0.0.2 over the private/VPN network).

server {
    listen 80;
    listen [::]:80;

    server_name rivnu.internal;

    client_max_body_size 20M;

    location / {
        proxy_pass http://10.0.0.3:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name api.rivnu.internal;

    client_max_body_size 20M;

    location / {
        proxy_pass http://10.0.0.3:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
