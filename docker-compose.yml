services:
  postgres:
    image: postgres:16
    container_name: eligio-demo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eligio_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eligio_demo_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-eligio_demo}
    volumes:
      - eligio_demo_postgres_data:/var/lib/postgresql/data

volumes:
  eligio_demo_postgres_data:
